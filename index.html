<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Cat Push</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    height: 100dvh; /* учитывает скрытие/появление адресной строки мобильного браузера */
    overflow: hidden;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
  }

  .tv-frame {
    position: relative;
    width: 940px;
    height: 640px;
    flex: none; /* не даём flex-контейнеру body сжимать рамку до масштабирования */
    background: #2b2b2b;
    border-radius: 28px;
    box-shadow:
      inset 0 0 0 6px #444,
      0 0 30px rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
  }

  #gameCanvas {
    /* ширина задаётся динамически из JS (resizeGameToFit) под реальные
       пропорции экрана — не фиксированный 900px, чтобы не оставалось
       пустых полей на широких (относительно высоты) экранах телефонов */
    height: 600px;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 100%);
    border-radius: 6px;
    filter: contrast(1.1) brightness(1.05);
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    -ms-interpolation-mode: nearest-neighbor;
  }

  /* Скан-линии поверх canvas — эффект ЭЛТ; ширина тоже задаётся из JS */
  .scanlines {
    position: absolute;
    height: 600px;
    border-radius: 6px;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.1) 0px,
      rgba(0, 0, 0, 0.1) 1px,
      transparent 1px,
      transparent 2px
    );
  }

  /* Подсказка повернуть телефон — только на маленьких экранах в портретной ориентации */
  .rotate-prompt {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #fff;
    font-family: monospace;
    text-align: center;
    padding: 24px;
  }

  .rotate-prompt .icon {
    font-size: 64px;
    animation: rotate-hint 1.6s ease-in-out infinite;
  }

  @keyframes rotate-hint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }

  @media (orientation: portrait) and (max-width: 768px) {
    .tv-frame {
      display: none;
    }
    .rotate-prompt {
      display: flex;
    }
  }

  /* Экранное управление — показываем только на сенсорных устройствах.
     Живёт ВНУТРИ .tv-frame (не во viewport), поэтому масштабируется вместе
     со всей игрой через тот же transform: scale() — не остаётся
     константного размера, когда игра уменьшается под маленький экран.
     Позиционировано в безопасной зоне под полкой (canvas y 440-600,
     т.е. frame-y ~460-620) — там ничего не отрисовывается (подтверждено
     кодом drawShelf/drawBackground, а не предположением), так что кнопки
     не перекрывают полку, кота или предметы.
     База отсчёта под размеры — реальный landscape-телефон (высота
     viewport ~360-375px, что даёт heightScale~0.54-0.56): при таком
     сжатии тач-таргеты в 44px (базовый HIG-минимум) визуально ужимаются
     до ~24px — некликабельно. Поэтому базовые размеры здесь взяты крупнее
     номинального минимума (72/80px), чтобы после сжатия рамкой реальный
     отрисованный размер оставался близко к 40-45px на самых частых
     мобильных экранах — компромисс, подтверждённый замером через
     getBoundingClientRect на реальных viewport-размерах, а не на глаз. */
  .touch-controls {
    display: none;
    position: absolute;
    inset: 0;
    pointer-events: none; /* сам контейнер прозрачен для тапов, кнопки внутри — нет */
    /* Базовая единица 4px — все размеры и отступы кнопок кратны ей,
       вместо случайных подобранных на глаз значений. */
    --tc-unit: 4px;
    --tc-gap: calc(var(--tc-unit) * 2); /* 8px — зазор между соседними тач-таргетами */
    --tc-edge: calc(var(--tc-unit) * 4); /* 16px — отступ от левого/правого края канвы */
    --tc-bottom: calc(var(--tc-unit) * 5); /* 20px — отступ от нижнего края канвы */
    --tc-btn: calc(var(--tc-unit) * 18); /* 72px */
    --tc-action-btn: calc(var(--tc-unit) * 20); /* 80px — крупнее, это основное частое действие */
  }

  @media (hover: none) and (pointer: coarse) {
    .touch-controls {
      display: block;
    }
  }

  /* D-pad в 2 ряда вместо классической 3×3-крестовины: Up сверху по
     центру, Left/Down/Right одним рядом снизу. Такая раскладка вдвое
     компактнее по высоте (2*tc-btn+tc-gap вместо 3*tc-btn+2*tc-gap),
     что и высвобождает бюджет безопасной зоны под увеличенные кнопки. */
  .touch-controls .dpad {
    position: absolute;
    left: var(--tc-edge);
    bottom: var(--tc-bottom);
    width: calc(var(--tc-btn) * 3 + var(--tc-gap) * 2);
    height: calc(var(--tc-btn) * 2 + var(--tc-gap));
  }

  .touch-controls .action-btn {
    position: absolute;
    right: var(--tc-edge);
    bottom: var(--tc-bottom);
    width: var(--tc-action-btn);
    height: var(--tc-action-btn);
  }

  .touch-controls button {
    position: absolute;
    pointer-events: auto;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 12px;
    color: #fff;
    font-family: monospace;
    font-size: 26px;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .touch-controls .action-btn button {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    font-size: 28px;
  }

  .touch-controls .dpad button {
    width: var(--tc-btn);
    height: var(--tc-btn);
  }
  .touch-controls .dpad button.dpad-up {
    top: 0;
    left: calc(var(--tc-btn) + var(--tc-gap));
  }
  .touch-controls .dpad button.dpad-down {
    top: calc(var(--tc-btn) + var(--tc-gap));
    left: calc(var(--tc-btn) + var(--tc-gap));
  }
  .touch-controls .dpad button.dpad-left {
    top: calc(var(--tc-btn) + var(--tc-gap));
    left: 0;
  }
  .touch-controls .dpad button.dpad-right {
    top: calc(var(--tc-btn) + var(--tc-gap));
    left: calc((var(--tc-btn) + var(--tc-gap)) * 2);
  }
</style>
</head>
<body>
  <div class="tv-frame">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div class="scanlines"></div>
    <div class="touch-controls">
      <div class="dpad">
        <button class="dpad-up" data-key="ArrowUp">▲</button>
        <button class="dpad-down" data-key="ArrowDown">▼</button>
        <button class="dpad-left" data-key="ArrowLeft">◀</button>
        <button class="dpad-right" data-key="ArrowRight">▶</button>
      </div>
      <div class="action-btn">
        <button data-key=" ">●</button>
      </div>
    </div>
  </div>
  <div class="rotate-prompt">
    <div class="icon">📱</div>
    <div>Поверните телефон, чтобы играть</div>
  </div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Тот же признак, что и в CSS-медиазапросе для .touch-controls — используется
  // ниже, чтобы увеличить спрайты именно на тач-устройствах: там вся рамка
  // сжимается сильнее под короткий viewport, и одинаковый с десктопом размер
  // выглядит слишком мелким.
  const isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

  const FRAME_HEIGHT = 640; // высота рамки фиксирована — вся вертикальная раскладка игры завязана на ней
  const BEZEL = 40; // общая толщина рамки по ширине (940 - 900 в исходном дизайне)
  const MIN_CANVAS_WIDTH = 700;
  const MAX_CANVAS_WIDTH = 1400; // не даём игре растягиваться абсурдно широко на ultra-wide десктопах
  const tvFrame = document.querySelector('.tv-frame');
  const scanlinesEl = document.querySelector('.scanlines');

  // Чистые функции — тестируемы напрямую, без чтения живых window.innerWidth/innerHeight.
  function computeHeightScale(viewportHeight) {
    return Math.min((viewportHeight * 0.96) / FRAME_HEIGHT, 1);
  }

  function computeCanvasWidth(viewportWidth, heightScale) {
    const desired = Math.round((viewportWidth * 0.98) / heightScale) - BEZEL;
    return Math.max(MIN_CANVAS_WIDTH, Math.min(MAX_CANVAS_WIDTH, desired));
  }

  function resizeGameToFit() {
    const heightScale = computeHeightScale(window.innerHeight);
    const canvasWidth = computeCanvasWidth(window.innerWidth, heightScale);

    if (canvas.width !== canvasWidth) {
      canvas.width = canvasWidth; // реальное разрешение отрисовки — вся игровая логика уже читает canvas.width динамически
    }

    canvas.style.width = canvasWidth + 'px';
    scanlinesEl.style.width = canvasWidth + 'px';
    tvFrame.style.width = (canvasWidth + BEZEL) + 'px';
    tvFrame.style.transform = `scale(${heightScale})`;
  }

  window.addEventListener('load', resizeGameToFit);
  window.addEventListener('resize', resizeGameToFit);
  window.addEventListener('orientationchange', resizeGameToFit);
  resizeGameToFit();

  const SHELF_Y = 420;
  const SHELF_Y_UPPER = 210; // было 250 — больше пространства между полками, прыжок читается яснее
  const SHELF_HEIGHT = 20;
  const SHELF_MARGIN = 20;

  // Один и тот же прыжок с обеих полок: короткое нажатие — маленький хоп на
  // месте (сбить предмет/запрыгнуть на пылесос, не покидая полку); удержание —
  // подъём на верхнюю полку (Марио-style variable jump height). Раньше прыжок
  // с нижней полки был жёстко привязан к CLIMB_VELOCITY и всегда улетал наверх,
  // не давая взаимодействовать с нижней полкой в прыжке.
  const JUMP_VELOCITY = -12;
  const JUMP_HOLD_GRAVITY_FACTOR = 0.25; // во сколько раз слабее гравитация, пока зажата клавиша прыжка
  const JUMP_HOLD_CAP_MS = 260; // после этого гравитация всегда полная, даже если клавиша ещё зажата
  const GRAVITY = 0.6;

  const CAT_SIZE = isTouchDevice ? 110 : 78; // на тач-устройствах крупнее — компенсирует более сильное сжатие рамки
  const CAT_DRAW_SCALE = CAT_SIZE / 60; // весь пиксель-арт кота нарисован в системе координат 60×60

  const cat = {
    x: 420,
    y: SHELF_Y - CAT_SIZE,
    width: CAT_SIZE,
    height: CAT_SIZE,
    speed: 4,
    vy: 0,
    isJumping: false,
    jumpStartTime: 0,
    shelfLevel: 0, // 0 = нижняя полка, 1 = верхняя (задача #12+)
    isRidingVacuum: false,
    stunnedUntil: 0
  };

  const STUN_DURATION = 650; // было 250 — более заметная пауза при случайном ударе ("как в Марио")

  let nextBlinkTime = Date.now() + 2000 + Math.random() * 2000;
  let blinkUntil = 0;
  let landingSquashUntil = 0;

  const VACUUM_SIDE_PENALTY = -20;
  const VACUUM_RIDE_BONUS = 15; // разовая награда за приземление, не за каждую секунду катания
  const VACUUM_SHELF_SWITCH_INTERVAL = 10000;
  const VACUUM_BASE_SPEED = 2;

  const vacuum = {
    x: 100,
    y: 0,
    width: isTouchDevice ? 76 : 54, // на тач-устройствах крупнее — компенсирует более сильное сжатие рамки
    height: isTouchDevice ? 42 : 30,
    speed: VACUUM_BASE_SPEED,
    direction: 1,
    shelfLevel: 0,
    shakeUntil: 0 // визуальная тряска при ударе сбоку, не влияет на физику
  };
  let lastVacuumShelfSwitch = Date.now();
  let vacuumSidePenaltyActive = false;

  function getShelfSurfaceY(shelfLevel) {
    return shelfLevel === 1 ? SHELF_Y_UPPER : SHELF_Y;
  }

  const keys = {};

  // Палитра — 16 цветов на всю игру, общая для кота, предметов и фона
  const palette = {
    catOrange: '#FF8C00',
    catBlack: '#000000',
    catWhite: '#FFFFFF',
    catPink: '#FFB6C1',
    mugBrown: '#8B4513',
    flowerPink: '#FF69B4',
    flowerGreen: '#228B22',
    potBrown: '#5C3A21',
    foodYellow: '#FFD700',
    foodOrange: '#FFA500',
    vaseBlue: '#4169E1',
    tvGray: '#808080',
    tvScreen: '#2F4F4F',
    shelfBrown: '#6B4226',
    wallpaperBase: '#241F2E',
    wallpaperAccent: '#332B40'
  };

  // Не даём стрелкам и пробелу скроллить страницу, заодно отслеживаем нажатия
  const controlKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', ' '];
  window.addEventListener('keydown', (e) => {
    if (gameOver) {
      resetGame();
      return;
    }
    keys[e.key] = true;
    keys[e.code] = true;
    if (controlKeys.includes(e.code) || controlKeys.includes(e.key)) {
      e.preventDefault();
    }
  }, { passive: false });
  window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
    keys[e.code] = false;
  });

  // Экранное сенсорное управление — просто выставляет те же флаги в keys{},
  // которые уже читает игровой цикл, поэтому логика игры не меняется вообще.
  document.querySelectorAll('.touch-controls button').forEach((button) => {
    const key = button.dataset.key;
    button.addEventListener(
      'touchstart',
      (e) => {
        e.preventDefault();
        if (gameOver) {
          resetGame();
          return;
        }
        keys[key] = true;
      },
      { passive: false }
    );
    button.addEventListener(
      'touchend',
      (e) => {
        e.preventDefault();
        keys[key] = false;
      },
      { passive: false }
    );
    button.addEventListener('touchcancel', () => {
      keys[key] = false;
    });
  });

  // Всплывающие подписи "+N"/"-N" — наглядная обратная связь при изменении счёта
  const SCORE_POPUP_DURATION = 800;
  let scorePopups = [];

  function spawnScorePopup(x, y, amount) {
    scorePopups.push({
      x,
      y,
      text: (amount > 0 ? '+' : '') + amount,
      color: amount > 0 ? '#4CFF4C' : '#FF4C4C',
      startTime: Date.now()
    });
  }

  function updateAndDrawScorePopups() {
    const now = Date.now();
    scorePopups = scorePopups.filter((p) => now - p.startTime < SCORE_POPUP_DURATION);
    scorePopups.forEach((p) => {
      const progress = (now - p.startTime) / SCORE_POPUP_DURATION;
      ctx.globalAlpha = 1 - progress;
      ctx.fillStyle = p.color;
      ctx.font = 'bold 16px monospace';
      ctx.fillText(p.text, p.x, p.y - progress * 30);
    });
    ctx.globalAlpha = 1;
  }

  // Точка столкновения — расходящееся кольцо в месте случайного удара (не для намеренных действий)
  const IMPACT_EFFECT_DURATION = 300;
  let impactEffects = [];

  function spawnImpactEffect(x, y) {
    impactEffects.push({ x, y, startTime: Date.now() });
  }

  function updateAndDrawImpactEffects() {
    const now = Date.now();
    impactEffects = impactEffects.filter((e) => now - e.startTime < IMPACT_EFFECT_DURATION);
    impactEffects.forEach((e) => {
      const progress = (now - e.startTime) / IMPACT_EFFECT_DURATION;
      ctx.globalAlpha = 1 - progress;
      ctx.strokeStyle = '#FF4C4C';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 4 + progress * 16, 0, Math.PI * 2);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }

  let score = 0;
  const BEST_SCORE_KEY = 'catPushBestScore';
  let bestScore = parseInt(localStorage.getItem(BEST_SCORE_KEY), 10) || 0;
  let jumpPressedLastFrame = false;
  let downPressedLastFrame = false;

  const MAX_LIVES = 3;
  let lives = MAX_LIVES;
  let gameOver = false;

  const LEVEL_UP_PAUSE_MS = 1200; // логическая пауза при переходе на новый уровень
  let levelUpPauseUntil = 0;

  // Штраф отнимает очки как обычно, но если он увёл бы счёт ниже 0 —
  // вместо ухода в минус теряется жизнь, а счёт просто фиксируется на 0.
  function adjustScore(amount, x, y) {
    if (amount < 0 && score + amount < 0) {
      score = 0;
      loseLife();
    } else {
      score = Math.max(0, score + amount);
    }
    if (x !== undefined) spawnScorePopup(x, y, amount);
  }

  function loseLife() {
    lives -= 1;
    if (lives <= 0) {
      triggerGameOver();
    }
  }

  function triggerGameOver() {
    gameOver = true;
  }

  function resetGame() {
    score = 0;
    lives = MAX_LIVES;
    gameOver = false;
    level = 1;
    levelUpPauseUntil = 0;
    items = [];
    lastSpawn = Date.now();
    scorePopups = [];
    impactEffects = [];

    cat.x = 420;
    cat.shelfLevel = 0;
    cat.y = SHELF_Y - CAT_SIZE;
    cat.vy = 0;
    cat.isJumping = false;
    cat.jumpStartTime = 0;
    cat.isRidingVacuum = false;
    cat.stunnedUntil = 0;

    vacuum.x = 100;
    vacuum.shelfLevel = 0;
    vacuum.direction = 1;
    vacuum.speed = VACUUM_BASE_SPEED;
    vacuum.shakeUntil = 0;
    vacuum.y = getShelfSurfaceY(vacuum.shelfLevel) - vacuum.height;
    lastVacuumShelfSwitch = Date.now();
    vacuumSidePenaltyActive = false;
  }

  function pushItem(item) {
    item.isPushed = true;
    item.fallY = item.y;
    adjustScore(item.type.points, item.x + item.width / 2, item.y);
  }

  function handleStomp() {
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      if (!item.isPushed && item.shelfLevel === cat.shelfLevel && checkCollision(cat, item)) {
        pushItem(item);
        break;
      }
    }
  }

  // Столкновение с опасным предметом без прыжка через него — штраф, как при толчке.
  // Прыжок (cat.isJumping) уклоняется от этой проверки; безопасные предметы не задеваются пассивно.
  // Только для опасных предметов (и отдельно для пылесоса в checkVacuumCollision) — усиленный
  // эффект удара: кольцо (как было) + тряска падающего предмета + более долгая заморозка кота.
  function checkPassiveCollisions() {
    if (cat.isJumping) return;
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      if (!item.isPushed && !item.type.isSafe && item.shelfLevel === cat.shelfLevel && checkCollision(cat, item)) {
        const impactX = (cat.x + cat.width / 2 + item.x + item.width / 2) / 2;
        const impactY = (cat.y + cat.height / 2 + item.y + item.height / 2) / 2;
        pushItem(item);
        item.shakeUntil = Date.now() + STUN_DURATION; // тряска во время падения, само падение не задерживается
        spawnImpactEffect(impactX, impactY);
        cat.stunnedUntil = Date.now() + STUN_DURATION;
        break;
      }
    }
  }

  function updateVacuum(deltaTime) {
    vacuum.speed = getVacuumSpeed();
    vacuum.x += vacuum.speed * vacuum.direction * deltaTime;
    const minX = SHELF_MARGIN;
    const maxX = canvas.width - SHELF_MARGIN - vacuum.width;
    if (vacuum.x <= minX) {
      vacuum.x = minX;
      vacuum.direction = 1;
    } else if (vacuum.x >= maxX) {
      vacuum.x = maxX;
      vacuum.direction = -1;
    }

    if (Date.now() - lastVacuumShelfSwitch > getVacuumShelfSwitchInterval()) {
      vacuum.shelfLevel = vacuum.shelfLevel === 0 ? 1 : 0;
      lastVacuumShelfSwitch = Date.now();
    }

    vacuum.y = getShelfSurfaceY(vacuum.shelfLevel) - vacuum.height;
  }

  // Езда сверху даёт разовый бонус за приземление (не за каждую секунду катания — иначе
  // выгоднее всего было бы просто кататься бесконечно). Столкновение сбоку на земле —
  // штраф с короткой заморозкой и эффектом удара в точке контакта.
  function checkVacuumCollision(deltaTime) {
    if (cat.isRidingVacuum) {
      const stillOnTop =
        cat.shelfLevel === vacuum.shelfLevel &&
        cat.x + cat.width > vacuum.x &&
        cat.x < vacuum.x + vacuum.width;
      if (!stillOnTop) {
        cat.isRidingVacuum = false;
        // сход с пылесоса — включаем гравитацию обратно, иначе кот зависает в воздухе
        cat.isJumping = true;
        cat.vy = 0;
      } else {
        cat.x += vacuum.speed * vacuum.direction * deltaTime;
        const minX = SHELF_MARGIN;
        const maxX = canvas.width - SHELF_MARGIN - cat.width;
        cat.x = Math.max(minX, Math.min(maxX, cat.x));
        cat.y = vacuum.y - cat.height;
      }
      return;
    }

    const overlapping = vacuum.shelfLevel === cat.shelfLevel && checkCollision(cat, vacuum);
    if (!overlapping) {
      vacuumSidePenaltyActive = false;
      return;
    }

    if (cat.isJumping && cat.vy > 0) {
      cat.isRidingVacuum = true;
      cat.isJumping = false;
      cat.vy = 0;
      cat.shelfLevel = vacuum.shelfLevel;
      cat.y = vacuum.y - cat.height;
      adjustScore(VACUUM_RIDE_BONUS, cat.x + cat.width / 2, cat.y);
    } else if (!cat.isJumping && !vacuumSidePenaltyActive) {
      const impactX = (cat.x + cat.width / 2 + vacuum.x + vacuum.width / 2) / 2;
      const impactY = (cat.y + cat.height / 2 + vacuum.y + vacuum.height / 2) / 2;
      adjustScore(VACUUM_SIDE_PENALTY, cat.x + cat.width / 2, cat.y);
      vacuumSidePenaltyActive = true;
      vacuum.shakeUntil = Date.now() + STUN_DURATION; // тряска пылесоса, усиливает эффект удара
      spawnImpactEffect(impactX, impactY);
      cat.stunnedUntil = Date.now() + STUN_DURATION;
    }
  }

  function updateCat(deltaTime) {
    if (Date.now() < cat.stunnedUntil) return; // короткая заморозка после случайного столкновения

    if (keys['ArrowLeft'] || keys['a'] || keys['A']) cat.x -= cat.speed * deltaTime;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) cat.x += cat.speed * deltaTime;
    const minX = SHELF_MARGIN;
    const maxX = canvas.width - SHELF_MARGIN - cat.width;
    cat.x = Math.max(minX, Math.min(maxX, cat.x));

    const jumpDown = !!(keys['ArrowUp'] || keys['w'] || keys['W']);
    if (jumpDown && !jumpPressedLastFrame && !cat.isJumping) {
      cat.isRidingVacuum = false; // прыжок с пылесоса = обычное спрыгивание
      cat.vy = JUMP_VELOCITY;
      cat.isJumping = true;
      cat.jumpStartTime = Date.now();
    }
    jumpPressedLastFrame = jumpDown;

    const downDown = !!(keys['ArrowDown'] || keys['s'] || keys['S']);
    if (downDown && !downPressedLastFrame && !cat.isJumping && cat.shelfLevel === 1) {
      cat.shelfLevel = 0;
      cat.vy = 2; // небольшой начальный толчок — дальше кота несёт гравитация на нижнюю полку
      cat.isJumping = true;
    }
    downPressedLastFrame = downDown;

    if (cat.isJumping) {
      // Удержание клавиши прыжка первые JUMP_HOLD_CAP_MS ослабляет гравитацию —
      // короткое нажатие даёт маленький хоп, удержание поднимает на верхнюю полку.
      // Только с нижней полки — на верхней подниматься некуда, поэтому прыжок
      // там всегда маленький хоп независимо от удержания клавиши.
      const isRising = cat.vy < 0;
      const withinHoldWindow = Date.now() - cat.jumpStartTime < JUMP_HOLD_CAP_MS;
      const gravity = (jumpDown && isRising && withinHoldWindow && cat.shelfLevel === 0) ? GRAVITY * JUMP_HOLD_GRAVITY_FACTOR : GRAVITY;
      cat.vy += gravity * deltaTime;
      cat.y += cat.vy * deltaTime;

      // подъём с нижней полки: как только достигли высоты верхней — переключаем уровень
      if (cat.shelfLevel === 0 && cat.vy < 0) {
        const upperGroundY = getShelfSurfaceY(1) - cat.height;
        if (cat.y <= upperGroundY) {
          cat.shelfLevel = 1;
        }
      }

      const groundY = getShelfSurfaceY(cat.shelfLevel) - cat.height;
      if (cat.vy > 0 && cat.y >= groundY) {
        cat.y = groundY;
        cat.vy = 0;
        cat.isJumping = false;
        landingSquashUntil = Date.now() + 150;
      }

      // сбивание предмета приземлением сверху — только пока кот снижается
      if (cat.vy > 0) {
        handleStomp();
      }
    }

    checkPassiveCollisions();
  }

  function drawBackground() {
    ctx.fillStyle = palette.wallpaperBase;
    ctx.fillRect(0, 0, canvas.width, SHELF_Y);

    ctx.fillStyle = palette.wallpaperAccent;
    const step = 30;
    for (let gy = 10; gy < SHELF_Y; gy += step) {
      for (let gx = 10; gx < canvas.width; gx += step) {
        ctx.fillRect(gx, gy, 4, 4);
      }
    }
  }

  function drawShelf(y) {
    ctx.fillStyle = palette.shelfBrown;
    ctx.fillRect(0, y, canvas.width, SHELF_HEIGHT);
    ctx.fillStyle = palette.potBrown;
    ctx.fillRect(0, y, canvas.width, 4);

    // текстура древесных волокон
    ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
    for (let gx = 6; gx < canvas.width; gx += 37) {
      ctx.fillRect(gx, y + 7, 18, 2);
    }
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    for (let gx = 20; gx < canvas.width; gx += 53) {
      ctx.fillRect(gx, y + 13, 14, 2);
    }
  }

  function drawShelves() {
    drawShelf(SHELF_Y);
    drawShelf(SHELF_Y_UPPER);
  }

  function drawVacuum() {
    const isShaking = Date.now() < vacuum.shakeUntil;
    const shakeX = isShaking ? Math.sin(Date.now() / 20) * 3 : 0;
    const x = Math.round(vacuum.x + shakeX);
    const y = Math.round(vacuum.y);

    ctx.fillStyle = palette.tvGray;
    ctx.fillRect(x + 2, y + 3, vacuum.width - 4, vacuum.height - 5);

    ctx.fillStyle = palette.catBlack;
    ctx.fillRect(x, y + vacuum.height - 4, vacuum.width, 4);

    ctx.fillStyle = palette.catPink;
    ctx.fillRect(x + vacuum.width / 2 - 3, y + 1, 6, 4);
  }

  function drawCat() {
    const x = Math.round(cat.x);
    const y = Math.round(cat.y);

    // моргание — раз в 2-4 сек, планируем следующее сразу после текущего
    const now = Date.now();
    if (now >= nextBlinkTime && now >= blinkUntil) {
      blinkUntil = now + 150;
      nextBlinkTime = now + 2000 + Math.random() * 2000;
    }
    const isBlinking = now < blinkUntil;

    // покачивание хвоста на месте — только когда кот не в прыжке
    const tailSway = cat.isJumping ? 0 : Math.round(Math.sin(now / 300) * 2);

    // сжатие/растяжение: тянемся вверх при взлёте, сжимаемся при падении и коротко при приземлении
    let scaleY = 1;
    if (cat.isJumping) {
      const vyNorm = Math.max(-1, Math.min(1, cat.vy / 15));
      scaleY = 1 - vyNorm * 0.12;
    } else if (now < landingSquashUntil) {
      const remaining = (landingSquashUntil - now) / 150;
      scaleY = 1 - remaining * 0.15;
    }
    const scaleX = 1 / scaleY;

    // Пиксель-арт кота нарисован ниже в системе координат 60×60 (нижняя точка —
    // тень на y+54). Масштабируем от НИЖНЕГО края (а не от центра), чтобы кот
    // визуально стоял на полке независимо от CAT_DRAW_SCALE, а не "парил" над
    // ней с растущим зазором при увеличении.
    const anchorX = x + cat.width / 2;
    const anchorY = y + cat.height;
    const origAnchorX = x + 30;
    const origAnchorY = y + 54;

    const isStunned = now < cat.stunnedUntil;

    ctx.save();
    if (isStunned) {
      // мигание при заморозке после случайного столкновения — как invincibility-flicker в Марио
      ctx.globalAlpha = Math.floor(now / 80) % 2 === 0 ? 1 : 0.35;
    }
    ctx.translate(anchorX, anchorY);
    ctx.scale(scaleX * CAT_DRAW_SCALE, scaleY * CAT_DRAW_SCALE);
    ctx.translate(-origAnchorX, -origAnchorY);

    // тело
    ctx.fillStyle = palette.catOrange;
    ctx.fillRect(x + 6, y + 15, 48, 39);

    // тень-обводка снизу
    ctx.fillStyle = palette.catBlack;
    ctx.fillRect(x + 6, y + 51, 48, 3);

    // треугольные уши
    ctx.fillStyle = palette.catOrange;
    ctx.fillRect(x + 9, y + 3, 12, 12);
    ctx.fillRect(x + 39, y + 3, 12, 12);
    ctx.fillStyle = palette.catBlack;
    ctx.fillRect(x + 9, y + 3, 12, 3);
    ctx.fillRect(x + 39, y + 3, 12, 3);
    ctx.fillRect(x + 9, y + 3, 3, 9);
    ctx.fillRect(x + 48, y + 3, 3, 9);

    // глаза (или закрытые полоски при моргании)
    if (isBlinking) {
      ctx.fillStyle = palette.catBlack;
      ctx.fillRect(x + 15, y + 27, 9, 2);
      ctx.fillRect(x + 36, y + 27, 9, 2);
    } else {
      ctx.fillStyle = palette.catWhite;
      ctx.fillRect(x + 15, y + 24, 9, 9);
      ctx.fillRect(x + 36, y + 24, 9, 9);
      ctx.fillStyle = palette.catBlack;
      ctx.fillRect(x + 18, y + 27, 3, 3);
      ctx.fillRect(x + 39, y + 27, 3, 3);
    }

    // нос
    ctx.fillStyle = palette.catPink;
    ctx.fillRect(x + 27, y + 33, 6, 5);

    // полосатый хвост — с покачиванием
    ctx.fillStyle = palette.catOrange;
    ctx.fillRect(x + 51, y + 30 + tailSway, 15, 9);
    ctx.fillStyle = palette.catBlack;
    ctx.fillRect(x + 51, y + 30 + tailSway, 15, 3);
    ctx.fillRect(x + 56, y + 33 + tailSway, 3, 6);
    ctx.fillRect(x + 62, y + 33 + tailSway, 3, 6);

    ctx.restore();
  }

  const ITEM_SIZE = isTouchDevice ? 68 : 48; // на тач-устройствах крупнее — компенсирует более сильное сжатие рамки
  const ITEM_DRAW_SCALE = ITEM_SIZE / 30; // пиксель-арт предметов нарисован в системе координат 30×30
  // Нижняя точка арта каждого предмета (в исходных координатах 30×30) — для
  // масштабирования от нижнего края, чтобы предмет визуально стоял на полке,
  // а не "парил" над ней с зазором, растущим вместе с ITEM_DRAW_SCALE.
  const ITEM_ART_BOTTOM = { mug: 26, flower: 29, food: 24, vase: 26, tv: 24 };
  const baseSpawnInterval = 3000;
  const MAX_ITEMS = 15; // защита от неограниченного роста, если игрок не толкает предметы

  const itemTypes = [
    { name: 'mug', isSafe: true, color: '#8B4513', points: 10 },
    { name: 'flower', isSafe: true, color: '#FF69B4', points: 15 },
    { name: 'food', isSafe: true, color: '#FFD700', points: 20 },
    { name: 'vase', isSafe: false, color: '#4169E1', points: -25 },
    { name: 'tv', isSafe: false, color: '#2F4F4F', points: -30 }
  ];

  let items = [];
  let lastSpawn = Date.now();
  let level = 1;

  function updateLevel() {
    const newLevel = Math.floor(score / 100) + 1;
    if (newLevel > level) {
      level = newLevel;
      levelUpPauseUntil = Date.now() + LEVEL_UP_PAUSE_MS; // логическая пауза + баннер "LEVEL UP"
    }
  }

  // Пылесос быстрее патрулирует и чаще меняет полку на высоких уровнях —
  // усложнение не только от количества/доли опасных предметов, но и от самого пылесоса.
  function getVacuumSpeed() {
    return Math.min(5, VACUUM_BASE_SPEED + (level - 1) * 0.3);
  }

  function getVacuumShelfSwitchInterval() {
    return Math.max(4000, VACUUM_SHELF_SWITCH_INTERVAL - (level - 1) * 500);
  }

  function getSpawnInterval() {
    return baseSpawnInterval / (1 + (level - 1) * 0.2);
  }

  function getRandomItemType() {
    const dangerousRatio = Math.min(0.6, 0.2 + (level - 1) * 0.1);
    const safeItems = itemTypes.filter((t) => t.isSafe);
    const dangerousItems = itemTypes.filter((t) => !t.isSafe);
    if (Math.random() < dangerousRatio) {
      return dangerousItems[Math.floor(Math.random() * dangerousItems.length)];
    }
    return safeItems[Math.floor(Math.random() * safeItems.length)];
  }

  const ITEM_SPAWN_PADDING = 8; // минимальный зазор между соседними предметами на полке

  // Пробуем несколько случайных X на выбранной полке, пока не найдём место без
  // пересечения с уже стоящими (не сбитыми) предметами. Если за N попыток не
  // нашли — пропускаем спавн в этом цикле, а не накладываем предметы друг на друга.
  function findNonOverlappingX(shelfLevel) {
    const minX = SHELF_MARGIN;
    const maxX = canvas.width - SHELF_MARGIN - ITEM_SIZE;
    for (let attempt = 0; attempt < 20; attempt++) {
      const x = minX + Math.random() * (maxX - minX);
      const overlaps = items.some((item) =>
        item.shelfLevel === shelfLevel &&
        !item.isPushed &&
        x < item.x + item.width + ITEM_SPAWN_PADDING &&
        x + ITEM_SIZE + ITEM_SPAWN_PADDING > item.x
      );
      if (!overlaps) return x;
    }
    return null;
  }

  function spawnItem() {
    const type = getRandomItemType();
    const shelfLevel = Math.random() < 0.5 ? 0 : 1;
    const x = findNonOverlappingX(shelfLevel);
    if (x === null) return; // полка занята — попробуем на следующем цикле спавна
    items.push({
      type,
      x,
      y: getShelfSurfaceY(shelfLevel) - ITEM_SIZE,
      shelfLevel,
      width: ITEM_SIZE,
      height: ITEM_SIZE
    });
  }

  function updateItems(deltaTime) {
    updateLevel();

    const now = Date.now();
    if (now - lastSpawn > getSpawnInterval() && items.length < MAX_ITEMS) {
      spawnItem();
      lastSpawn = now;
    }

    items.forEach((item) => {
      if (item.isPushed) {
        item.fallY += 5 * deltaTime;
      }
    });
    items = items.filter((item) => !item.isPushed || item.fallY < canvas.height);
  }

  function drawMug(x, y) {
    ctx.fillStyle = palette.mugBrown;
    ctx.fillRect(x + 6, y + 8, 14, 18);
    ctx.fillStyle = palette.catBlack;
    ctx.fillRect(x + 6, y + 8, 14, 2);

    // ручка (C-образная)
    ctx.fillStyle = palette.mugBrown;
    ctx.fillRect(x + 20, y + 10, 4, 2);
    ctx.fillRect(x + 22, y + 12, 3, 8);
    ctx.fillRect(x + 20, y + 20, 4, 2);

    // пар
    ctx.fillStyle = palette.catWhite;
    ctx.fillRect(x + 9, y + 2, 2, 4);
    ctx.fillRect(x + 14, y, 2, 5);
  }

  function drawFlower(x, y) {
    // горшок
    ctx.fillStyle = palette.potBrown;
    ctx.fillRect(x + 9, y + 22, 12, 7);

    // стебель
    ctx.fillStyle = palette.flowerGreen;
    ctx.fillRect(x + 14, y + 12, 2, 11);

    // лепестки вокруг центра
    ctx.fillStyle = palette.flowerPink;
    ctx.fillRect(x + 11, y + 4, 4, 4);
    ctx.fillRect(x + 19, y + 4, 4, 4);
    ctx.fillRect(x + 7, y + 8, 4, 4);
    ctx.fillRect(x + 23, y + 8, 4, 4);
    ctx.fillRect(x + 15, y + 4, 4, 4);

    // центр
    ctx.fillStyle = palette.foodYellow;
    ctx.fillRect(x + 14, y + 7, 5, 5);
  }

  function drawFood(x, y) {
    // печенье — блочный круг
    ctx.fillStyle = palette.foodOrange;
    ctx.fillRect(x + 9, y + 6, 14, 2);
    ctx.fillRect(x + 5, y + 8, 22, 14);
    ctx.fillRect(x + 9, y + 22, 14, 2);

    // шоколадные крошки
    ctx.fillStyle = palette.potBrown;
    ctx.fillRect(x + 10, y + 12, 3, 3);
    ctx.fillRect(x + 18, y + 14, 3, 3);
    ctx.fillRect(x + 13, y + 18, 3, 3);
  }

  function drawVase(x, y) {
    // узкое горлышко, широкое тело, узкое основание
    ctx.fillStyle = palette.vaseBlue;
    ctx.fillRect(x + 11, y + 2, 8, 6);
    ctx.fillRect(x + 6, y + 8, 18, 14);
    ctx.fillRect(x + 9, y + 22, 12, 4);

    // декоративные полосы
    ctx.fillStyle = palette.catWhite;
    ctx.fillRect(x + 6, y + 12, 18, 2);
    ctx.fillRect(x + 6, y + 18, 18, 2);
  }

  function drawTV(x, y) {
    // корпус
    ctx.fillStyle = palette.tvGray;
    ctx.fillRect(x + 2, y + 4, 26, 20);

    // экран
    ctx.fillStyle = palette.tvScreen;
    ctx.fillRect(x + 5, y + 7, 20, 14);

    // антенна (V-образная, ступенчатая, контрастная тёмная — чтобы не сливаться с корпусом)
    ctx.fillStyle = palette.catBlack;
    ctx.fillRect(x + 14, y + 3, 2, 2);
    ctx.fillRect(x + 12, y + 1, 2, 2);
    ctx.fillRect(x + 10, y - 1, 2, 2);
    ctx.fillRect(x + 16, y + 3, 2, 2);
    ctx.fillRect(x + 18, y + 1, 2, 2);
    ctx.fillRect(x + 20, y - 1, 2, 2);
  }

  const itemDrawers = {
    mug: drawMug,
    flower: drawFlower,
    food: drawFood,
    vase: drawVase,
    tv: drawTV
  };

  function drawItems() {
    const now = Date.now();
    items.forEach((item) => {
      const isShaking = item.isShaking && now < item.shakeUntil;
      const shakeX = isShaking ? Math.sin(now / 20) * 3 : 0;
      const x = Math.round(item.x + shakeX);
      const y = Math.round(item.isPushed ? item.fallY : item.y);
      const drawer = itemDrawers[item.type.name];
      const origBottom = ITEM_ART_BOTTOM[item.type.name] || 28;

      // Масштабирование от нижнего края арта (см. ITEM_ART_BOTTOM) вместо
      // центра — предмет стоит на полке вплотную, без визуального зазора.
      const anchorX = x + item.width / 2;
      const anchorY = y + item.height;
      const origAnchorX = x + 15;
      const origAnchorY = y + origBottom;

      ctx.save();
      ctx.translate(anchorX, anchorY);
      ctx.scale(ITEM_DRAW_SCALE, ITEM_DRAW_SCALE);
      ctx.translate(-origAnchorX, -origAnchorY);
      if (drawer) {
        drawer(x, y);
      } else {
        ctx.fillStyle = item.type.color;
        ctx.fillRect(x, y, item.width, item.height);
      }
      ctx.restore();
    });
  }

  let spacePressedLastFrame = false;

  function checkCollision(a, b) {
    return (
      a.x < b.x + b.width &&
      a.x + a.width > b.x &&
      a.y < b.y + b.height &&
      a.y + a.height > b.y
    );
  }

  function handlePush() {
    const spaceDown = !!(keys[' '] || keys['Space']);
    if (spaceDown && !spacePressedLastFrame) {
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        if (!item.isPushed && item.shelfLevel === cat.shelfLevel && checkCollision(cat, item)) {
          pushItem(item);
          break;
        }
      }
    }
    spacePressedLastFrame = spaceDown;
  }

  function drawUI() {
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem(BEST_SCORE_KEY, bestScore);
    }

    ctx.fillStyle = '#ffffff';
    ctx.font = '20px monospace';
    ctx.fillText('SCORE: ' + score, 20, 30);
    ctx.fillText('BEST: ' + bestScore, 20, 60);
    ctx.fillText('LEVEL: ' + level, 20, 90);
    ctx.fillText('LIVES: ' + '♥'.repeat(lives), 20, 120);
  }

  function drawLevelUpBanner() {
    const progress = 1 - (levelUpPauseUntil - Date.now()) / LEVEL_UP_PAUSE_MS;
    const pulse = 1 + Math.sin(progress * Math.PI) * 0.15;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(pulse, pulse);
    ctx.fillStyle = '#4CFF4C';
    ctx.font = 'bold 40px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL ' + level + '!', 0, 0);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  function drawGameOverOverlay() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#FF4C4C';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);

    ctx.fillStyle = '#ffffff';
    ctx.font = '20px monospace';
    ctx.fillText('SCORE: ' + score + '   BEST: ' + bestScore, canvas.width / 2, canvas.height / 2 + 10);
    ctx.fillText('Press any key / tap to restart', canvas.width / 2, canvas.height / 2 + 45);
    ctx.textAlign = 'left';
  }

  let lastFrameTime = performance.now();

  function gameLoop() {
    const now = performance.now();
    const rawDelta = (now - lastFrameTime) / 16.67;
    // ограничиваем скачок дельты — иначе после сворачивания/переключения вкладки
    // кот и предметы "телепортируются" за один кадр
    const deltaTime = Math.min(rawDelta, 5);
    lastFrameTime = now;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const isLevelUpPaused = Date.now() < levelUpPauseUntil;
    if (!gameOver && !isLevelUpPaused) {
      updateCat(deltaTime);
      handlePush();
      updateItems(deltaTime);
      updateVacuum(deltaTime);
      checkVacuumCollision(deltaTime);
    }

    drawBackground();
    drawShelves();
    drawItems();
    drawVacuum();
    drawCat();
    drawUI();
    updateAndDrawScorePopups();
    updateAndDrawImpactEffects();

    if (gameOver) {
      drawGameOverOverlay();
    } else if (isLevelUpPaused) {
      drawLevelUpBanner();
    }

    requestAnimationFrame(gameLoop);
  }

  requestAnimationFrame(gameLoop);
</script>
