<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Cat Push</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
  }

  .tv-frame {
    position: relative;
    width: 940px;
    height: 640px;
    flex: none; /* не даём flex-контейнеру body сжимать рамку до масштабирования */
    background: #2b2b2b;
    border-radius: 28px;
    box-shadow:
      inset 0 0 0 6px #444,
      0 0 30px rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
  }

  #gameCanvas {
    width: 900px;
    height: 600px;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 100%);
    border-radius: 6px;
    filter: contrast(1.1) brightness(1.05);
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    -ms-interpolation-mode: nearest-neighbor;
  }

  /* Скан-линии поверх canvas — эффект ЭЛТ */
  .scanlines {
    position: absolute;
    width: 900px;
    height: 600px;
    border-radius: 6px;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.1) 0px,
      rgba(0, 0, 0, 0.1) 1px,
      transparent 1px,
      transparent 2px
    );
  }

  /* Подсказка повернуть телефон — только на маленьких экранах в портретной ориентации */
  .rotate-prompt {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #fff;
    font-family: monospace;
    text-align: center;
    padding: 24px;
  }

  .rotate-prompt .icon {
    font-size: 64px;
    animation: rotate-hint 1.6s ease-in-out infinite;
  }

  @keyframes rotate-hint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }

  @media (orientation: portrait) and (max-width: 768px) {
    .tv-frame {
      display: none;
    }
    .rotate-prompt {
      display: flex;
    }
  }

  /* Экранное управление — показываем только на сенсорных устройствах */
  .touch-controls {
    display: none;
  }

  @media (hover: none) and (pointer: coarse) {
    .touch-controls {
      display: block;
    }
  }

  .touch-controls .dpad {
    position: fixed;
    left: 16px;
    bottom: 16px;
    width: 150px;
    height: 150px;
    z-index: 10;
  }

  .touch-controls .action-btn {
    position: fixed;
    right: 24px;
    bottom: 40px;
    width: 84px;
    height: 84px;
    z-index: 10;
  }

  .touch-controls button {
    position: absolute;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 12px;
    color: #fff;
    font-family: monospace;
    font-size: 24px;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .touch-controls .action-btn button {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    font-size: 16px;
  }

  .touch-controls .dpad button.dpad-up { top: 0; left: 50px; width: 50px; height: 50px; }
  .touch-controls .dpad button.dpad-down { top: 100px; left: 50px; width: 50px; height: 50px; }
  .touch-controls .dpad button.dpad-left { top: 50px; left: 0; width: 50px; height: 50px; }
  .touch-controls .dpad button.dpad-right { top: 50px; left: 100px; width: 50px; height: 50px; }
</style>
</head>
<body>
  <div class="tv-frame">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div class="scanlines"></div>
  </div>
  <div class="rotate-prompt">
    <div class="icon">📱</div>
    <div>Поверните телефон, чтобы играть</div>
  </div>

  <div class="touch-controls">
    <div class="dpad">
      <button class="dpad-up" data-key="ArrowUp">▲</button>
      <button class="dpad-down" data-key="ArrowDown">▼</button>
      <button class="dpad-left" data-key="ArrowLeft">◀</button>
      <button class="dpad-right" data-key="ArrowRight">▶</button>
    </div>
    <div class="action-btn">
      <button data-key=" ">●</button>
    </div>
  </div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const FRAME_WIDTH = 940;
  const FRAME_HEIGHT = 640;
  const tvFrame = document.querySelector('.tv-frame');

  // Чистая функция — считает коэффициент масштаба отдельно от чтения живых
  // window.innerWidth/innerHeight, чтобы её можно было протестировать напрямую.
  function computeGameScale(viewportWidth, viewportHeight) {
    return Math.min(viewportWidth / FRAME_WIDTH, viewportHeight / FRAME_HEIGHT, 1);
  }

  function resizeGameToFit() {
    const scale = computeGameScale(window.innerWidth, window.innerHeight);
    tvFrame.style.transform = `scale(${scale})`;
  }

  window.addEventListener('load', resizeGameToFit);
  window.addEventListener('resize', resizeGameToFit);
  window.addEventListener('orientationchange', resizeGameToFit);
  resizeGameToFit();

  const SHELF_Y = 420;
  const SHELF_Y_UPPER = 250;
  const SHELF_HEIGHT = 20;
  const SHELF_MARGIN = 20;

  const JUMP_VELOCITY = -12; // прыжок на месте (уклонение/сбивание) — используется на верхней полке
  const CLIMB_VELOCITY = -15; // прыжок с нижней полки на верхнюю
  const GRAVITY = 0.6;

  const cat = {
    x: 420,
    y: SHELF_Y - 60,
    width: 60,
    height: 60,
    speed: 4,
    vy: 0,
    isJumping: false,
    shelfLevel: 0, // 0 = нижняя полка, 1 = верхняя (задача #12+)
    isRidingVacuum: false,
    stunnedUntil: 0
  };

  const STUN_DURATION = 250; // короткая заморозка управления при случайном столкновении

  let nextBlinkTime = Date.now() + 2000 + Math.random() * 2000;
  let blinkUntil = 0;
  let landingSquashUntil = 0;

  const VACUUM_SIDE_PENALTY = -20;
  const VACUUM_RIDE_BONUS = 15; // разовая награда за приземление, не за каждую секунду катания
  const VACUUM_SHELF_SWITCH_INTERVAL = 10000;

  const vacuum = {
    x: 100,
    y: 0,
    width: 36,
    height: 20,
    speed: 2,
    direction: 1,
    shelfLevel: 0
  };
  let lastVacuumShelfSwitch = Date.now();
  let vacuumSidePenaltyActive = false;

  function getShelfSurfaceY(shelfLevel) {
    return shelfLevel === 1 ? SHELF_Y_UPPER : SHELF_Y;
  }

  const keys = {};

  // Палитра — 16 цветов на всю игру, общая для кота, предметов и фона
  const palette = {
    catOrange: '#FF8C00',
    catBlack: '#000000',
    catWhite: '#FFFFFF',
    catPink: '#FFB6C1',
    mugBrown: '#8B4513',
    flowerPink: '#FF69B4',
    flowerGreen: '#228B22',
    potBrown: '#5C3A21',
    foodYellow: '#FFD700',
    foodOrange: '#FFA500',
    vaseBlue: '#4169E1',
    tvGray: '#808080',
    tvScreen: '#2F4F4F',
    shelfBrown: '#6B4226',
    wallpaperBase: '#241F2E',
    wallpaperAccent: '#332B40'
  };

  // Не даём стрелкам и пробелу скроллить страницу, заодно отслеживаем нажатия
  const controlKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', ' '];
  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    keys[e.code] = true;
    if (controlKeys.includes(e.code) || controlKeys.includes(e.key)) {
      e.preventDefault();
    }
  }, { passive: false });
  window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
    keys[e.code] = false;
  });

  // Экранное сенсорное управление — просто выставляет те же флаги в keys{},
  // которые уже читает игровой цикл, поэтому логика игры не меняется вообще.
  document.querySelectorAll('.touch-controls button').forEach((button) => {
    const key = button.dataset.key;
    button.addEventListener(
      'touchstart',
      (e) => {
        e.preventDefault();
        keys[key] = true;
      },
      { passive: false }
    );
    button.addEventListener(
      'touchend',
      (e) => {
        e.preventDefault();
        keys[key] = false;
      },
      { passive: false }
    );
    button.addEventListener('touchcancel', () => {
      keys[key] = false;
    });
  });

  // Всплывающие подписи "+N"/"-N" — наглядная обратная связь при изменении счёта
  const SCORE_POPUP_DURATION = 800;
  let scorePopups = [];

  function spawnScorePopup(x, y, amount) {
    scorePopups.push({
      x,
      y,
      text: (amount > 0 ? '+' : '') + amount,
      color: amount > 0 ? '#4CFF4C' : '#FF4C4C',
      startTime: Date.now()
    });
  }

  function updateAndDrawScorePopups() {
    const now = Date.now();
    scorePopups = scorePopups.filter((p) => now - p.startTime < SCORE_POPUP_DURATION);
    scorePopups.forEach((p) => {
      const progress = (now - p.startTime) / SCORE_POPUP_DURATION;
      ctx.globalAlpha = 1 - progress;
      ctx.fillStyle = p.color;
      ctx.font = 'bold 16px monospace';
      ctx.fillText(p.text, p.x, p.y - progress * 30);
    });
    ctx.globalAlpha = 1;
  }

  // Точка столкновения — расходящееся кольцо в месте случайного удара (не для намеренных действий)
  const IMPACT_EFFECT_DURATION = 300;
  let impactEffects = [];

  function spawnImpactEffect(x, y) {
    impactEffects.push({ x, y, startTime: Date.now() });
  }

  function updateAndDrawImpactEffects() {
    const now = Date.now();
    impactEffects = impactEffects.filter((e) => now - e.startTime < IMPACT_EFFECT_DURATION);
    impactEffects.forEach((e) => {
      const progress = (now - e.startTime) / IMPACT_EFFECT_DURATION;
      ctx.globalAlpha = 1 - progress;
      ctx.strokeStyle = '#FF4C4C';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 4 + progress * 16, 0, Math.PI * 2);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }

  let score = 0;
  let jumpPressedLastFrame = false;
  let downPressedLastFrame = false;

  function pushItem(item) {
    item.isPushed = true;
    item.fallY = item.y;
    score = Math.max(0, score + item.type.points);
    spawnScorePopup(item.x + item.width / 2, item.y, item.type.points);
  }

  function handleStomp() {
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      if (!item.isPushed && item.shelfLevel === cat.shelfLevel && checkCollision(cat, item)) {
        pushItem(item);
        break;
      }
    }
  }

  // Столкновение с опасным предметом без прыжка через него — штраф, как при толчке.
  // Прыжок (cat.isJumping) уклоняется от этой проверки; безопасные предметы не задеваются пассивно.
  function checkPassiveCollisions() {
    if (cat.isJumping) return;
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      if (!item.isPushed && !item.type.isSafe && item.shelfLevel === cat.shelfLevel && checkCollision(cat, item)) {
        const impactX = (cat.x + cat.width / 2 + item.x + item.width / 2) / 2;
        const impactY = (cat.y + cat.height / 2 + item.y + item.height / 2) / 2;
        pushItem(item);
        spawnImpactEffect(impactX, impactY);
        cat.stunnedUntil = Date.now() + STUN_DURATION;
        break;
      }
    }
  }

  function updateVacuum(deltaTime) {
    vacuum.x += vacuum.speed * vacuum.direction * deltaTime;
    const minX = SHELF_MARGIN;
    const maxX = canvas.width - SHELF_MARGIN - vacuum.width;
    if (vacuum.x <= minX) {
      vacuum.x = minX;
      vacuum.direction = 1;
    } else if (vacuum.x >= maxX) {
      vacuum.x = maxX;
      vacuum.direction = -1;
    }

    if (Date.now() - lastVacuumShelfSwitch > VACUUM_SHELF_SWITCH_INTERVAL) {
      vacuum.shelfLevel = vacuum.shelfLevel === 0 ? 1 : 0;
      lastVacuumShelfSwitch = Date.now();
    }

    vacuum.y = getShelfSurfaceY(vacuum.shelfLevel) - vacuum.height;
  }

  // Езда сверху даёт разовый бонус за приземление (не за каждую секунду катания — иначе
  // выгоднее всего было бы просто кататься бесконечно). Столкновение сбоку на земле —
  // штраф с короткой заморозкой и эффектом удара в точке контакта.
  function checkVacuumCollision(deltaTime) {
    if (cat.isRidingVacuum) {
      const stillOnTop =
        cat.shelfLevel === vacuum.shelfLevel &&
        cat.x + cat.width > vacuum.x &&
        cat.x < vacuum.x + vacuum.width;
      if (!stillOnTop) {
        cat.isRidingVacuum = false;
        // сход с пылесоса — включаем гравитацию обратно, иначе кот зависает в воздухе
        cat.isJumping = true;
        cat.vy = 0;
      } else {
        cat.x += vacuum.speed * vacuum.direction * deltaTime;
        const minX = SHELF_MARGIN;
        const maxX = canvas.width - SHELF_MARGIN - cat.width;
        cat.x = Math.max(minX, Math.min(maxX, cat.x));
        cat.y = vacuum.y - cat.height;
      }
      return;
    }

    const overlapping = vacuum.shelfLevel === cat.shelfLevel && checkCollision(cat, vacuum);
    if (!overlapping) {
      vacuumSidePenaltyActive = false;
      return;
    }

    if (cat.isJumping && cat.vy > 0) {
      cat.isRidingVacuum = true;
      cat.isJumping = false;
      cat.vy = 0;
      cat.shelfLevel = vacuum.shelfLevel;
      cat.y = vacuum.y - cat.height;
      score += VACUUM_RIDE_BONUS;
      spawnScorePopup(cat.x + cat.width / 2, cat.y, VACUUM_RIDE_BONUS);
    } else if (!cat.isJumping && !vacuumSidePenaltyActive) {
      const impactX = (cat.x + cat.width / 2 + vacuum.x + vacuum.width / 2) / 2;
      const impactY = (cat.y + cat.height / 2 + vacuum.y + vacuum.height / 2) / 2;
      score = Math.max(0, score + VACUUM_SIDE_PENALTY);
      vacuumSidePenaltyActive = true;
      spawnScorePopup(cat.x + cat.width / 2, cat.y, VACUUM_SIDE_PENALTY);
      spawnImpactEffect(impactX, impactY);
      cat.stunnedUntil = Date.now() + STUN_DURATION;
    }
  }

  function updateCat(deltaTime) {
    if (Date.now() < cat.stunnedUntil) return; // короткая заморозка после случайного столкновения

    if (keys['ArrowLeft'] || keys['a'] || keys['A']) cat.x -= cat.speed * deltaTime;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) cat.x += cat.speed * deltaTime;
    const minX = SHELF_MARGIN;
    const maxX = canvas.width - SHELF_MARGIN - cat.width;
    cat.x = Math.max(minX, Math.min(maxX, cat.x));

    const jumpDown = !!(keys['ArrowUp'] || keys['w'] || keys['W']);
    if (jumpDown && !jumpPressedLastFrame && !cat.isJumping) {
      cat.isRidingVacuum = false; // прыжок с пылесоса = обычное спрыгивание
      // с нижней полки — высокий прыжок-подъём; с верхней — обычный прыжок на месте
      cat.vy = cat.shelfLevel === 0 ? CLIMB_VELOCITY : JUMP_VELOCITY;
      cat.isJumping = true;
    }
    jumpPressedLastFrame = jumpDown;

    const downDown = !!(keys['ArrowDown'] || keys['s'] || keys['S']);
    if (downDown && !downPressedLastFrame && !cat.isJumping && cat.shelfLevel === 1) {
      cat.shelfLevel = 0;
      cat.vy = 2; // небольшой начальный толчок — дальше кота несёт гравитация на нижнюю полку
      cat.isJumping = true;
    }
    downPressedLastFrame = downDown;

    if (cat.isJumping) {
      cat.vy += GRAVITY * deltaTime;
      cat.y += cat.vy * deltaTime;

      // подъём с нижней полки: как только достигли высоты верхней — переключаем уровень
      if (cat.shelfLevel === 0 && cat.vy < 0) {
        const upperGroundY = getShelfSurfaceY(1) - cat.height;
        if (cat.y <= upperGroundY) {
          cat.shelfLevel = 1;
        }
      }

      const groundY = getShelfSurfaceY(cat.shelfLevel) - cat.height;
      if (cat.vy > 0 && cat.y >= groundY) {
        cat.y = groundY;
        cat.vy = 0;
        cat.isJumping = false;
        landingSquashUntil = Date.now() + 150;
      }

      // сбивание предмета приземлением сверху — только пока кот снижается
      if (cat.vy > 0) {
        handleStomp();
      }
    }

    checkPassiveCollisions();
  }

  function drawBackground() {
    ctx.fillStyle = palette.wallpaperBase;
    ctx.fillRect(0, 0, canvas.width, SHELF_Y);

    ctx.fillStyle = palette.wallpaperAccent;
    const step = 30;
    for (let gy = 10; gy < SHELF_Y; gy += step) {
      for (let gx = 10; gx < canvas.width; gx += step) {
        ctx.fillRect(gx, gy, 4, 4);
      }
    }
  }

  function drawShelf(y) {
    ctx.fillStyle = palette.shelfBrown;
    ctx.fillRect(0, y, canvas.width, SHELF_HEIGHT);
    ctx.fillStyle = palette.potBrown;
    ctx.fillRect(0, y, canvas.width, 4);

    // текстура древесных волокон
    ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
    for (let gx = 6; gx < canvas.width; gx += 37) {
      ctx.fillRect(gx, y + 7, 18, 2);
    }
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    for (let gx = 20; gx < canvas.width; gx += 53) {
      ctx.fillRect(gx, y + 13, 14, 2);
    }
  }

  function drawShelves() {
    drawShelf(SHELF_Y);
    drawShelf(SHELF_Y_UPPER);
  }

  function drawVacuum() {
    const x = Math.round(vacuum.x);
    const y = Math.round(vacuum.y);

    ctx.fillStyle = palette.tvGray;
    ctx.fillRect(x + 2, y + 3, vacuum.width - 4, vacuum.height - 5);

    ctx.fillStyle = palette.catBlack;
    ctx.fillRect(x, y + vacuum.height - 4, vacuum.width, 4);

    ctx.fillStyle = palette.catPink;
    ctx.fillRect(x + vacuum.width / 2 - 3, y + 1, 6, 4);
  }

  function drawCat() {
    const x = Math.round(cat.x);
    const y = Math.round(cat.y);

    // моргание — раз в 2-4 сек, планируем следующее сразу после текущего
    const now = Date.now();
    if (now >= nextBlinkTime && now >= blinkUntil) {
      blinkUntil = now + 150;
      nextBlinkTime = now + 2000 + Math.random() * 2000;
    }
    const isBlinking = now < blinkUntil;

    // покачивание хвоста на месте — только когда кот не в прыжке
    const tailSway = cat.isJumping ? 0 : Math.round(Math.sin(now / 300) * 2);

    // сжатие/растяжение: тянемся вверх при взлёте, сжимаемся при падении и коротко при приземлении
    let scaleY = 1;
    if (cat.isJumping) {
      const vyNorm = Math.max(-1, Math.min(1, cat.vy / 15));
      scaleY = 1 - vyNorm * 0.12;
    } else if (now < landingSquashUntil) {
      const remaining = (landingSquashUntil - now) / 150;
      scaleY = 1 - remaining * 0.15;
    }
    const scaleX = 1 / scaleY;

    const centerX = x + cat.width / 2;
    const centerY = y + cat.height / 2;

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.scale(scaleX, scaleY);
    ctx.translate(-centerX, -centerY);

    // тело
    ctx.fillStyle = palette.catOrange;
    ctx.fillRect(x + 6, y + 15, 48, 39);

    // тень-обводка снизу
    ctx.fillStyle = palette.catBlack;
    ctx.fillRect(x + 6, y + 51, 48, 3);

    // треугольные уши
    ctx.fillStyle = palette.catOrange;
    ctx.fillRect(x + 9, y + 3, 12, 12);
    ctx.fillRect(x + 39, y + 3, 12, 12);
    ctx.fillStyle = palette.catBlack;
    ctx.fillRect(x + 9, y + 3, 12, 3);
    ctx.fillRect(x + 39, y + 3, 12, 3);
    ctx.fillRect(x + 9, y + 3, 3, 9);
    ctx.fillRect(x + 48, y + 3, 3, 9);

    // глаза (или закрытые полоски при моргании)
    if (isBlinking) {
      ctx.fillStyle = palette.catBlack;
      ctx.fillRect(x + 15, y + 27, 9, 2);
      ctx.fillRect(x + 36, y + 27, 9, 2);
    } else {
      ctx.fillStyle = palette.catWhite;
      ctx.fillRect(x + 15, y + 24, 9, 9);
      ctx.fillRect(x + 36, y + 24, 9, 9);
      ctx.fillStyle = palette.catBlack;
      ctx.fillRect(x + 18, y + 27, 3, 3);
      ctx.fillRect(x + 39, y + 27, 3, 3);
    }

    // нос
    ctx.fillStyle = palette.catPink;
    ctx.fillRect(x + 27, y + 33, 6, 5);

    // полосатый хвост — с покачиванием
    ctx.fillStyle = palette.catOrange;
    ctx.fillRect(x + 51, y + 30 + tailSway, 15, 9);
    ctx.fillStyle = palette.catBlack;
    ctx.fillRect(x + 51, y + 30 + tailSway, 15, 3);
    ctx.fillRect(x + 56, y + 33 + tailSway, 3, 6);
    ctx.fillRect(x + 62, y + 33 + tailSway, 3, 6);

    ctx.restore();
  }

  const ITEM_SIZE = 30;
  const baseSpawnInterval = 3000;
  const MAX_ITEMS = 15; // защита от неограниченного роста, если игрок не толкает предметы

  const itemTypes = [
    { name: 'mug', isSafe: true, color: '#8B4513', points: 10 },
    { name: 'flower', isSafe: true, color: '#FF69B4', points: 15 },
    { name: 'food', isSafe: true, color: '#FFD700', points: 20 },
    { name: 'vase', isSafe: false, color: '#4169E1', points: -25 },
    { name: 'tv', isSafe: false, color: '#2F4F4F', points: -30 }
  ];

  let items = [];
  let lastSpawn = Date.now();
  let level = 1;

  function updateLevel() {
    const newLevel = Math.floor(score / 100) + 1;
    if (newLevel > level) {
      level = newLevel;
    }
  }

  function getSpawnInterval() {
    return baseSpawnInterval / (1 + (level - 1) * 0.2);
  }

  function getRandomItemType() {
    const dangerousRatio = Math.min(0.6, 0.2 + (level - 1) * 0.1);
    const safeItems = itemTypes.filter((t) => t.isSafe);
    const dangerousItems = itemTypes.filter((t) => !t.isSafe);
    if (Math.random() < dangerousRatio) {
      return dangerousItems[Math.floor(Math.random() * dangerousItems.length)];
    }
    return safeItems[Math.floor(Math.random() * safeItems.length)];
  }

  function spawnItem() {
    const type = getRandomItemType();
    const minX = SHELF_MARGIN;
    const maxX = canvas.width - SHELF_MARGIN - ITEM_SIZE;
    const x = minX + Math.random() * (maxX - minX);
    const shelfLevel = Math.random() < 0.5 ? 0 : 1;
    items.push({
      type,
      x,
      y: getShelfSurfaceY(shelfLevel) - ITEM_SIZE,
      shelfLevel,
      width: ITEM_SIZE,
      height: ITEM_SIZE
    });
  }

  function updateItems(deltaTime) {
    updateLevel();

    const now = Date.now();
    if (now - lastSpawn > getSpawnInterval() && items.length < MAX_ITEMS) {
      spawnItem();
      lastSpawn = now;
    }

    items.forEach((item) => {
      if (item.isPushed) {
        item.fallY += 5 * deltaTime;
      }
    });
    items = items.filter((item) => !item.isPushed || item.fallY < canvas.height);
  }

  function drawMug(x, y) {
    ctx.fillStyle = palette.mugBrown;
    ctx.fillRect(x + 6, y + 8, 14, 18);
    ctx.fillStyle = palette.catBlack;
    ctx.fillRect(x + 6, y + 8, 14, 2);

    // ручка (C-образная)
    ctx.fillStyle = palette.mugBrown;
    ctx.fillRect(x + 20, y + 10, 4, 2);
    ctx.fillRect(x + 22, y + 12, 3, 8);
    ctx.fillRect(x + 20, y + 20, 4, 2);

    // пар
    ctx.fillStyle = palette.catWhite;
    ctx.fillRect(x + 9, y + 2, 2, 4);
    ctx.fillRect(x + 14, y, 2, 5);
  }

  function drawFlower(x, y) {
    // горшок
    ctx.fillStyle = palette.potBrown;
    ctx.fillRect(x + 9, y + 22, 12, 7);

    // стебель
    ctx.fillStyle = palette.flowerGreen;
    ctx.fillRect(x + 14, y + 12, 2, 11);

    // лепестки вокруг центра
    ctx.fillStyle = palette.flowerPink;
    ctx.fillRect(x + 11, y + 4, 4, 4);
    ctx.fillRect(x + 19, y + 4, 4, 4);
    ctx.fillRect(x + 7, y + 8, 4, 4);
    ctx.fillRect(x + 23, y + 8, 4, 4);
    ctx.fillRect(x + 15, y + 4, 4, 4);

    // центр
    ctx.fillStyle = palette.foodYellow;
    ctx.fillRect(x + 14, y + 7, 5, 5);
  }

  function drawFood(x, y) {
    // печенье — блочный круг
    ctx.fillStyle = palette.foodOrange;
    ctx.fillRect(x + 9, y + 6, 14, 2);
    ctx.fillRect(x + 5, y + 8, 22, 14);
    ctx.fillRect(x + 9, y + 22, 14, 2);

    // шоколадные крошки
    ctx.fillStyle = palette.potBrown;
    ctx.fillRect(x + 10, y + 12, 3, 3);
    ctx.fillRect(x + 18, y + 14, 3, 3);
    ctx.fillRect(x + 13, y + 18, 3, 3);
  }

  function drawVase(x, y) {
    // узкое горлышко, широкое тело, узкое основание
    ctx.fillStyle = palette.vaseBlue;
    ctx.fillRect(x + 11, y + 2, 8, 6);
    ctx.fillRect(x + 6, y + 8, 18, 14);
    ctx.fillRect(x + 9, y + 22, 12, 4);

    // декоративные полосы
    ctx.fillStyle = palette.catWhite;
    ctx.fillRect(x + 6, y + 12, 18, 2);
    ctx.fillRect(x + 6, y + 18, 18, 2);
  }

  function drawTV(x, y) {
    // корпус
    ctx.fillStyle = palette.tvGray;
    ctx.fillRect(x + 2, y + 4, 26, 20);

    // экран
    ctx.fillStyle = palette.tvScreen;
    ctx.fillRect(x + 5, y + 7, 20, 14);

    // антенна (V-образная, ступенчатая, контрастная тёмная — чтобы не сливаться с корпусом)
    ctx.fillStyle = palette.catBlack;
    ctx.fillRect(x + 14, y + 3, 2, 2);
    ctx.fillRect(x + 12, y + 1, 2, 2);
    ctx.fillRect(x + 10, y - 1, 2, 2);
    ctx.fillRect(x + 16, y + 3, 2, 2);
    ctx.fillRect(x + 18, y + 1, 2, 2);
    ctx.fillRect(x + 20, y - 1, 2, 2);
  }

  const itemDrawers = {
    mug: drawMug,
    flower: drawFlower,
    food: drawFood,
    vase: drawVase,
    tv: drawTV
  };

  function drawItems() {
    items.forEach((item) => {
      const x = Math.round(item.x);
      const y = Math.round(item.isPushed ? item.fallY : item.y);
      const drawer = itemDrawers[item.type.name];
      if (drawer) {
        drawer(x, y);
      } else {
        ctx.fillStyle = item.type.color;
        ctx.fillRect(x, y, item.width, item.height);
      }
    });
  }

  let spacePressedLastFrame = false;

  function checkCollision(a, b) {
    return (
      a.x < b.x + b.width &&
      a.x + a.width > b.x &&
      a.y < b.y + b.height &&
      a.y + a.height > b.y
    );
  }

  function handlePush() {
    const spaceDown = !!(keys[' '] || keys['Space']);
    if (spaceDown && !spacePressedLastFrame) {
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        if (!item.isPushed && item.shelfLevel === cat.shelfLevel && checkCollision(cat, item)) {
          pushItem(item);
          break;
        }
      }
    }
    spacePressedLastFrame = spaceDown;
  }

  function drawUI() {
    ctx.fillStyle = '#ffffff';
    ctx.font = '20px monospace';
    ctx.fillText('SCORE: ' + score, 20, 30);
    ctx.fillText('LEVEL: ' + level, 20, 60);
  }

  let lastFrameTime = performance.now();

  function gameLoop() {
    const now = performance.now();
    const rawDelta = (now - lastFrameTime) / 16.67;
    // ограничиваем скачок дельты — иначе после сворачивания/переключения вкладки
    // кот и предметы "телепортируются" за один кадр
    const deltaTime = Math.min(rawDelta, 5);
    lastFrameTime = now;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    updateCat(deltaTime);
    handlePush();
    updateItems(deltaTime);
    updateVacuum(deltaTime);
    checkVacuumCollision(deltaTime);

    drawBackground();
    drawShelves();
    drawItems();
    drawVacuum();
    drawCat();
    drawUI();
    updateAndDrawScorePopups();
    updateAndDrawImpactEffects();

    requestAnimationFrame(gameLoop);
  }

  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
